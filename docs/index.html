<!DOCTYPE html>

<head>

  <title>LH Nautical — Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #141A21;
      font-family: -apple-system, Segoe UI, Arial, sans-serif;
    }
    header {
      padding: 14px 20px;
      color: #F2F5F8;
      display: flex;
      align-items: baseline;
      gap: 12px;
      border-bottom: 1px solid #2E3A47;
    }
    header h1 {
      font-size: 16px;
      margin: 0;
      letter-spacing: 1px;
    }
    header a {
      color: #6FA3C9;
      font-size: 13px;
      text-decoration: none;
    }
    header a:hover { text-decoration: underline; }
    iframe {
      width: 100%;
      height: calc(100% - 49px);
      border: none;
    }
  </style>
</head>
