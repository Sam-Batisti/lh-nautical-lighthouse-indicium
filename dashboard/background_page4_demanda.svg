<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141A21"/>
      <stop offset="60%" stop-color="#1B242E"/>
      <stop offset="100%" stop-color="#10151B"/>
    </linearGradient>
    <linearGradient id="cardfill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#212B36"/>
      <stop offset="100%" stop-color="#1A222B"/>
    </linearGradient>
    <radialGradient id="glow" cx="90%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#5C7A99" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5C7A99" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- faint nautical chart grid -->
  <g stroke="#5C7A99" stroke-width="0.5" opacity="0.07">
    <line x1="90" y1="150" x2="1280" y2="150"/>
    <line x1="90" y1="300" x2="1280" y2="300"/>
    <line x1="90" y1="450" x2="1280" y2="450"/>
    <line x1="90" y1="600" x2="1280" y2="600"/>
    <line x1="380" y1="0" x2="380" y2="720"/>
    <line x1="670" y1="0" x2="670" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
  </g>

  <!-- ============ LEFT NAV SIDEBAR ============ -->
  <rect x="0" y="0" width="90" height="720" fill="#0F141A"/>
  <line x1="90" y1="0" x2="90" y2="720" stroke="#2A3540" stroke-width="1"/>
  <g transform="translate(45,655)" opacity="0.4" stroke="#5C7A99" fill="none">
    <circle r="28" stroke-width="1"/>
    <g stroke-width="1">
      <line x1="0" y1="-28" x2="0" y2="28"/>
      <line x1="-28" y1="0" x2="28" y2="0"/>
    </g>
  </g>
  <g transform="translate(45,40)" opacity="0.5" stroke="#5C7A99" fill="none" stroke-width="1.4">
    <!-- small anchor mark -->
    <circle cx="0" cy="-14" r="3.4"/>
    <line x1="0" y1="-10.6" x2="0" y2="14"/>
    <path d="M -10,4 C -10,14 -4,18 0,18 C 4,18 10,14 10,4"/>
    <line x1="-9" y1="4" x2="-4" y2="4"/>
    <line x1="9" y1="4" x2="4" y2="4"/>
    <line x1="-8" y1="-4" x2="8" y2="-4"/>
  </g>

  <!-- title: single tone, wide letter-spacing, thin rule -->
  <text x="110" y="32" font-family="Segoe UI, Arial" font-size="21" font-weight="600" fill="#D8E0E8" letter-spacing="5">LH NAUTICAL</text>
  <text x="110" y="52" font-family="Segoe UI, Arial" font-size="12" font-weight="400" fill="#7C93A8" letter-spacing="4">VISAO DE DEMANDA</text>
  <line x1="110" y1="64" x2="1240" y2="64" stroke="#2A3540" stroke-width="1"/>
  <line x1="110" y1="64" x2="230" y2="64" stroke="#5C7A99" stroke-width="1.6"/>

  <!-- ================= CARD PANELS (top row) ================= -->
  <!-- Icones diferentes das paginas 1, 2 e 3 -->
  <g font-family="Segoe UI, Arial">
    <rect x="110" y="82" width="267" height="100" rx="8" fill="url(#cardfill)" stroke="#2E3A47" stroke-width="1"/>
    <!-- Media de Vendas por Dia: calendario -->
    <g transform="translate(140,133)" stroke="#8F93D9" stroke-width="1.6" fill="none" opacity="0.9" stroke-linejoin="round">
      <rect x="-11" y="-9" width="22" height="19" rx="2"/>
      <line x1="-11" y1="-3" x2="11" y2="-3"/>
      <line x1="-6" y1="-12" x2="-6" y2="-7"/>
      <line x1="6" y1="-12" x2="6" y2="-7"/>
    </g>

    <rect x="397" y="82" width="267" height="100" rx="8" fill="url(#cardfill)" stroke="#2E3A47" stroke-width="1"/>
    <!-- Melhor Dia da Semana: check -->
    <g transform="translate(427,132)" stroke="#8F93D9" stroke-width="1.6" fill="none" opacity="0.9" stroke-linecap="round" stroke-linejoin="round">
      <circle r="13"/>
      <path d="M -6,0 L -1.5,5 L 7,-6"/>
    </g>

    <rect x="684" y="82" width="267" height="100" rx="8" fill="url(#cardfill)" stroke="#2E3A47" stroke-width="1"/>
    <!-- Pior Dia da Semana: alerta -->
    <g transform="translate(714,134)" stroke="#8F93D9" stroke-width="1.6" fill="none" opacity="0.9" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 0,-13 L 12,10 L -12,10 Z"/>
      <line x1="0" y1="-4" x2="0" y2="3"/>
      <circle cx="0" cy="7" r="1.3" fill="#8F93D9" stroke="none"/>
    </g>

    <rect x="971" y="82" width="267" height="100" rx="8" fill="url(#cardfill)" stroke="#2E3A47" stroke-width="1"/>
    <!-- MAE da Previsao: alvo -->
    <g transform="translate(1001,132)" stroke="#8F93D9" stroke-width="1.6" fill="none" opacity="0.9">
      <circle r="12"/>
      <circle r="6"/>
      <circle r="1.6" fill="#8F93D9" stroke="none"/>
    </g>
  </g>

  <!-- ================= CHART PANELS ================= -->
  <!-- Row 2: dois paineis iguais -->
  <g>
    <rect x="110" y="202" width="555" height="260" rx="8" fill="url(#cardfill)" stroke="#2E3A47" stroke-width="1"/>
    <rect x="685" y="202" width="555" height="260" rx="8" fill="url(#cardfill)" stroke="#2E3A47" stroke-width="1"/>
  </g>
  <!-- Row 3: painel unico, largo (vendas diarias - serie longa, 2020-2026) -->
  <g>
    <rect x="110" y="482" width="1130" height="230" rx="8" fill="url(#cardfill)" stroke="#2E3A47" stroke-width="1"/>
  </g>
</svg>
